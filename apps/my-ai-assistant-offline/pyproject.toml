[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-assistant-offline"
version = "0.1.0"
description = "Offline data, dataset-generation, and RAG-indexing pipelines."
requires-python = ">=3.12"
dependencies = [
    "setuptools>=69,<82",
    "pydantic==2.8.2",
    "pydantic-settings>=2.15,<3",
    "pymongo>=4.10,<5",
    "python-dotenv>=1.0,<2",
    "langchain-core>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "langchain-mongodb>=0.4,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "openai==1.59.9",
    "litellm>=1.0,<2",
    "psutil>=6,<8",
    "tqdm>=4.66,<5",
    "zenml[server]==0.73.0",
    "crawl4ai==0.3.745",
    "playwright==1.49.1",
    "matplotlib>=3.9,<4",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

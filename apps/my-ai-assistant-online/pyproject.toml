[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-assistant-online"
version = "0.1.0"
description = "Online agentic RAG application."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.8.2",
    "pydantic-settings>=2.15,<3",
    "langchain-core>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "langchain-mongodb>=0.4,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "pymongo>=4.10,<5",
    "litellm>=1.0,<2",
    "opik>=0.1.0",
    "smolagents>=1.4.1,<2.0",
    "gradio>=5.12.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
